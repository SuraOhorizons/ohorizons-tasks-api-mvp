apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ohorizons-tasks-api-mvp
  description: API CRUD de tareas para demo Open Horizons, generado desde la plantilla tasks-api
spec:
  type: service
  lifecycle: experimental
  owner: platform-engineering
  providesApis:
    - ohorizons-tasks-api-mvp-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ohorizons-tasks-api-mvp-api
  description: CRUD API de tareas para ohorizons-tasks-api-mvp
spec:
  type: openapi
  lifecycle: experimental
  owner: platform-engineering
  definition: |
    openapi: 3.0.0
    info:
      title: ohorizons-tasks-api-mvp API
      version: 1.0.0
    paths:
      /health:
        get:
          summary: Health check endpoint
          responses:
            '200':
              description: Service is healthy
      /ready:
        get:
          summary: Readiness probe (verifica conexión a la base de datos)
          responses:
            '200':
              description: Service is ready
            '503':
              description: Service is not ready
      /metrics:
        get:
          summary: Prometheus metrics
          responses:
            '200':
              description: Metrics in Prometheus text format
      /tasks:
        get:
          summary: Lista todas las tareas
          responses:
            '200':
              description: Array de tareas
        post:
          summary: Crea una tarea
          responses:
            '201':
              description: Tarea creada
            '400':
              description: title requerido
      /tasks/{id}:
        get:
          summary: Obtiene una tarea por id
          responses:
            '200':
              description: Tarea encontrada
            '404':
              description: No encontrada
        patch:
          summary: Actualiza una tarea
          responses:
            '200':
              description: Tarea actualizada
            '404':
              description: No encontrada
        delete:
          summary: Elimina una tarea
          responses:
            '204':
              description: Eliminada
            '404':
              description: No encontrada
