name: Build and Push to Azure Container Registry

on:
  push:
    branches:
      - main
      - develop

env:
  ACR_NAME: crsuradev
  REGISTRY: crsuradev.azurecr.io
  IMAGE_NAME: ohorizons-tasks-api-prueba
  SUBSCRIPTION_ID: f0550323-fb0b-44d4-8a39-ecf0f6c2dbc9

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "<CLIENT_ID>" \
            --password "<CLIENT_SECRET>" \
            --tenant "<TENANT_ID>"

      - name: Validate Azure Credentials
        run: |
          echo "Validando credenciales..."
          
          az account show

          az account set \
            --subscription "${{ env.SUBSCRIPTION_ID }}"

          echo "Validando acceso al ACR..."
          az acr show \
            --name "${{ env.ACR_NAME }}" \
            --query name \
            --output tsv

          echo "✅ Credenciales válidas y acceso al ACR confirmado"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "${{ env.SUBSCRIPTION_ID }}"

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${{ env.ACR_NAME }}"

      - name: Build Docker Image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:latest \
            -t $REGISTRY/$IMAGE_NAME:${GITHUB_SHA} \
            -t $REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME} \
            .

      - name: Push Docker Images
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest
          docker push $REGISTRY/$IMAGE_NAME:${GITHUB_SHA}
          docker push $REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}

      - name: Show Published Images
        run: |
          echo "Published images:"
          echo "$REGISTRY/$IMAGE_NAME:latest"
          echo "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}"
          echo "$REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}"