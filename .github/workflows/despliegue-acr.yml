name: Build and Push to ACR
on:
 push:
   branches:
     - main
     - develop
env:
 ACR_NAME: crsuradev
 REGISTRY: crsuradev.azurecr.io
 IMAGE_NAME: ohorizons-tasks-api-prueba
 TENANT_ID: 9dbc76ea-fb25-4b07-8f07-5dc315999b76
 SUBSCRIPTION_ID: f0550323-fb0b-44d4-8a39-ecf0f6c2dbc9
jobs:
 build-and-push:
   runs-on: ubuntu-latest
   permissions:
     contents: read
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Azure Logout
       run: |
         az logout || true
     - name: Azure Login
       run: |
         az login --tenant $TENANT_ID
     - name: Show Current Account
       run: |
         echo "===== ACCOUNT ====="
         az account show
     - name: List Subscriptions
       run: |
         echo "===== SUBSCRIPTIONS ====="
         az account list -o table
     - name: Select Subscription
       run: |
         az account set --subscription $SUBSCRIPTION_ID
     - name: Validate Subscription
       run: |
         echo "===== ACTIVE SUBSCRIPTION ====="
         az account show -o table
     - name: Current User
       run: |
         echo "===== USER ====="
         az account show --query user -o json
     ##- name: Show User Roles
        ##run: |
          ##USER=$(az account show --query user.name -o tsv)
          ##echo "User: $USER"
          ##az role assignment list --assignee "$USER" --all -o table
     - name: Validate ACR
       run: |
         echo "===== ACR ====="
         az acr show --name $ACR_NAME -o table
     - name: Login to ACR
       run: |
         az acr login --name $ACR_NAME
     - name: List Repositories
       run: |
         az acr repository list --name $ACR_NAME -o table
     - name: Build Docker Image
       run: |
         docker build -t $REGISTRY/$IMAGE_NAME:latest -t $REGISTRY/$IMAGE_NAME:${GITHUB_SHA} -t $REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME} .
     - name: Push Docker Image
       run: |
         docker push $REGISTRY/$IMAGE_NAME:latest
         docker push $REGISTRY/$IMAGE_NAME:${GITHUB_SHA}
         docker push $REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}
     - name: Summary
       run: |
         echo "Images published:"
         echo "$REGISTRY/$IMAGE_NAME:latest"
         echo "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}"
         echo "$REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}"