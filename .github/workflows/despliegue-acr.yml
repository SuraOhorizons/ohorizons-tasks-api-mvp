name: Build and Push to ACR
on:
 push:
   branches:
     - main
     - develop
env:
 ACR_NAME: crsuradev
 REGISTRY: crsuradev.azurecr.io
 IMAGE_NAME: ohorizons-tasks-api-prueba
 TENANT_ID: 9dbc76ea-fb25-4b07-8f07-5dc315999b76
 SUBSCRIPTION_ID: f0550323-fb0b-44d4-8a39-ecf0f6c2dbc9
jobs:
 build-and-push:
   runs-on: ubuntu-latest
   permissions:
     contents: read
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Azure Login
       run: |
         az login --service-principal 
           --username "07630def-c403-4203-afcd-1399246159ed" 
           --password "LCp8Q~QHOdrw0jb-IIBzcUGbjJReX.5Wojqllcm8" 
           --tenant "9dbc76ea-fb25-4b07-8f07-5dc315999b76"
     - name: Select Subscription
       run: |
         az account set --subscription "f0550323-fb0b-44d4-8a39-ecf0f6c2dbc9"
     - name: Validate Account
       run: |
         az account show -o table
     - name: Validate ACR
       run: |
         az acr show --name crsuradev -o table
     - name: Login to ACR
       run: |
         az acr login --name crsuradev
     - name: List Repositories
       run: |
         az acr repository list --name crsuradev -o table
     - name: Build Docker Image
       run: |
         docker build -t $REGISTRY/$IMAGE_NAME:latest -t $REGISTRY/$IMAGE_NAME:${GITHUB_SHA} -t $REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME} .
     - name: Push Docker Images
       run: |
         docker push $REGISTRY/$IMAGE_NAME:latest
         docker push $REGISTRY/$IMAGE_NAME:${GITHUB_SHA}
         docker push $REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}
     - name: Summary
       run: |
         echo "======================================"
         echo "Images published:"
         echo "$REGISTRY/$IMAGE_NAME:latest"
         echo "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}"
         echo "$REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}"
         echo "======================================"