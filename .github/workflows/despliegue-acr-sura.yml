name: Build and Push to ACR
on:
 push:
   branches:
     - main
     - develop
env:
 ACR_NAME: crsuradev
 REGISTRY: crsuradev.azurecr.io
 IMAGE_NAME: ohorizons-tasks-api-prueba
 AZURE_TENANT_ID: 9dbc76ea-fb25-4b07-8f07-5dc315999b76
 AZURE_SUBSCRIPTION_ID: f0550323-fb0b-44d4-8a39-ecf0f6c2dbc9
jobs:
 build-and-push:
   runs-on: ubuntu-latest
   permissions:
     contents: read
   steps:
     - name: Checkout Repository
       uses: actions/checkout@v4
     - name: Azure Login
       run: |
         az login --service-principal 
           --username "${{ secrets.AZURE_CLIENT_ID }}" 
           --password "${{ secrets.AZURE_CLIENT_SECRET }}" 
           --tenant "${{ secrets.AZURE_TENANT_ID }}"
     - name: List Available Subscriptions
       run: |
         echo "===== AVAILABLE SUBSCRIPTIONS ====="
         az account list -o table
     - name: Select Subscription
       run: |
         az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
     - name: Validate Current Subscription
       run: |
         echo "===== CURRENT SUBSCRIPTION ====="
         az account show -o table
     - name: Validate Azure Container Registry
       run: |
         echo "===== ACR ====="
         az acr show --name "$ACR_NAME" -o table
     - name: Login to Azure Container Registry
       run: |
         az acr login --name "$ACR_NAME"
     - name: List Repositories
       run: |
         az acr repository list --name "$ACR_NAME" -o table
     - name: Build Docker Image
       run: |
         docker build \
           -t $REGISTRY/$IMAGE_NAME:latest \
           -t $REGISTRY/$IMAGE_NAME:${GITHUB_SHA} \
           -t $REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME} .
     - name: Push Docker Images
       run: |
         docker push $REGISTRY/$IMAGE_NAME:latest
         docker push $REGISTRY/$IMAGE_NAME:${GITHUB_SHA}
         docker push $REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}
     - name: Summary
       run: |
         echo "========================================="
         echo "Published images:"
         echo "$REGISTRY/$IMAGE_NAME:latest"
         echo "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}"
         echo "$REGISTRY/$IMAGE_NAME:${GITHUB_REF_NAME}"
         echo "========================================="